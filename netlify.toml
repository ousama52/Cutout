[build]
  command = "npm run build"
  publish = "dist"

# Cross-origin isolation lets onnxruntime-web use SharedArrayBuffer and run the
# model on multiple threads. Keep this in step with vite.config.js.
[[headers]]
  for = "/*"
  [headers.values]
    Cross-Origin-Opener-Policy = "same-origin"
    Cross-Origin-Embedder-Policy = "require-corp"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"

# Hashed build output is immutable.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

# Single page app: send unknown paths to the shell.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
